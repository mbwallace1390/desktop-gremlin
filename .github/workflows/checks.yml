name: checks

# Real Tk/App checks with desktop services isolated by the harness. Windows
# provides a desktop session; Linux input checks stay on a dedicated Xvfb display.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Match the interpreter the downloads are built with, so the gate on
          # every push exercises the same Python that ships.
          python-version: "3.14"
      - name: Install pywin32
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run every check
        run: python tests\run_all.py -v

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Python and an isolated X11 desktop
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3.10-venv python3-tk xvfb xauth x11-utils openbox libx11-6 libxext6 libxtst6 libxrandr2 libxss1
          /usr/bin/python3.10 -m venv .venv-linux
      - name: Run shared and Linux checks on X11
        env:
          GREMLIN_ISOLATED_X11: "1"
          XDG_SESSION_TYPE: x11
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' bash -euo pipefail -c '
            openbox > "$RUNNER_TEMP/gremlin-openbox.log" 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true" EXIT
            for attempt in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            .venv-linux/bin/python tests/run_all.py -v
          '
